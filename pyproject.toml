[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mayotter"
version = "1.0.5"
description = "複数のXアカウントを表示するアプリ"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
]


[tool.ruff]
line-length = 100
target-version = "py310"
